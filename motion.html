<style>
:root{
  --bg:#0E0E10;
  --surface:#161618;
  --ink:#ECECEE;
  --mute:#A3A3AA;
  --line:#2A2A2E;
  --accent:#F0562A;
  --accent-deep:#D4441A;
  --violet:#A29DFF;
  --radius:0px;
  --gutter:clamp(1.1rem,4vw,3rem);
  --col:min(78rem,100%);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(0,0,0,.085) 1px, transparent 1px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1.0625rem;
  line-height:1.6;
  overflow-wrap:break-word;
}
img,video,iframe{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.wrap{width:var(--col);margin-inline:auto;padding-inline:var(--gutter)}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:.75rem 1rem;z-index:60}
.skip:focus{left:.5rem;top:.5rem}

.masthead{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid rgba(0,0,0,.06)}
.masthead .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.85rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-weight:800;font-size:1.25rem;letter-spacing:-.03em}
.brand .bot{height:2rem;width:2rem;flex:none;display:block;object-fit:cover}
.nav{display:flex;align-items:center;gap:.35rem}
.nav a{text-decoration:none;color:var(--ink);font-weight:500;font-size:.975rem;padding:.5rem .8rem;border-radius:999px}
.nav a:hover{background:rgba(0,0,0,.05)}
.nav a[aria-current="page"]{color:var(--violet);font-weight:700}
.nav .cta{background:var(--ink);color:#fff;font-weight:600;padding:.6rem 1.15rem;margin-left:.35rem}
.nav .cta:hover{background:#000}

.hero{text-align:center;padding-block:clamp(3rem,8vw,6.5rem) clamp(2rem,5vw,3.5rem)}
h1.display{font-weight:800;font-size:clamp(2.6rem,8.4vw,6.5rem);line-height:.95;letter-spacing:-.045em;margin:0 auto;max-width:16ch;text-wrap:balance}
.hero .lede{margin:clamp(1.25rem,3vw,1.9rem) auto 0;max-width:46ch;font-size:clamp(1.0625rem,1.7vw,1.3rem);line-height:1.5;color:var(--mute)}

.actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:2rem;justify-content:center}
.section .actions{justify-content:flex-start}
.btn{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;font-weight:600;font-size:1rem;padding:.85rem 1.5rem;border-radius:999px;background:var(--ink);color:#fff;border:1px solid var(--ink)}
.btn:hover{background:#000}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.accent:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.quiet{background:transparent;color:var(--ink);border-color:rgba(0,0,0,.25)}
.btn.quiet:hover{background:rgba(0,0,0,.05)}

.section{padding-block:clamp(2.75rem,6vw,5rem)}
.section-head{margin-bottom:clamp(1.5rem,3.5vw,2.5rem);max-width:34ch}
.section-head h2{font-weight:800;font-size:clamp(1.9rem,4.6vw,3.4rem);line-height:1;letter-spacing:-.04em;margin:0}
.section-head p{margin:.85rem 0 0;color:var(--mute);max-width:46ch}
.prose{max-width:60ch}
.prose p{margin:0 0 1.1rem}
.prose p:last-child{margin-bottom:0}

.featured{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(24rem,100%),1fr));gap:clamp(1.25rem,2.6vw,2rem);margin-bottom:clamp(2rem,4vw,3rem)}
.featured .frame{aspect-ratio:16/9}
.featured .piece-body{padding:1.35rem 1.5rem 1.6rem}
.featured .piece-body h3{font-size:clamp(1.35rem,2.4vw,1.75rem);letter-spacing:-.03em}
.subhead{font-weight:700;font-size:1.15rem;letter-spacing:-.02em;margin:0 0 1.1rem;color:var(--mute)}
.pieces{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(19rem,100%),1fr));gap:clamp(1.25rem,2.6vw,2rem)}
figure.piece{margin:0;background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(0,0,0,.07);display:flex;flex-direction:column}
.frame{aspect-ratio:16/9;position:relative;overflow:hidden;background:#111}
.frame video,.frame iframe{width:100%;height:100%;border:0;object-fit:cover}
.teaser{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(13rem,100%),1fr));gap:clamp(1rem,2.2vw,1.5rem);margin-bottom:clamp(1.5rem,3vw,2rem)}
.teaser a{display:block;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(0,0,0,.07);background:var(--surface);line-height:0}
.teaser a:hover{border-color:rgba(0,0,0,.22)}
.teaser img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
.frame.vertical img.vbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) brightness(.5);transform:scale(1.2)}
.frame.vertical video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.framelink{position:absolute;inset:0;display:block}
.framecta{position:absolute;left:.8rem;bottom:.8rem;background:rgba(0,0,0,.72);color:#fff;font-size:.82rem;font-weight:600;letter-spacing:-.01em;padding:.35rem .8rem;border-radius:999px}
.framelink:hover .framecta,.framelink:focus-visible .framecta{background:var(--accent)}
.plainlink{text-decoration:none}
.plainlink:hover{text-decoration:underline;text-underline-offset:3px}
.frame.awaiting{display:grid;place-content:center;gap:.35rem;text-align:center;padding:1.25rem}
.frame.awaiting b{font-weight:700;font-size:1rem;color:#fff;letter-spacing:-.01em}
.frame.awaiting span{font-size:.85rem;color:rgba(255,255,255,.82);max-width:24ch;margin-inline:auto}
.t1{background:#2B3EE0}
.t2{background:#F0562A}
.t3{background:#12694A}
.t4{background:#17171A}
.t5{background:#6D28D9}
.t6{background:#B54708}
.piece-body{padding:1.15rem 1.25rem 1.35rem;flex:1;display:flex;flex-direction:column}
.piece-body h3{font-weight:700;font-size:1.2rem;letter-spacing:-.025em;line-height:1.2;margin:0 0 .5rem}
.piece-body p{margin:0 0 1rem;color:var(--mute);font-size:.975rem}
dl.spec{margin:auto 0 0;font-size:.9rem;border-top:1px solid rgba(0,0,0,.08);padding-top:.75rem}
dl.spec div{display:flex;gap:.75rem;padding:.2rem 0}
dl.spec dt{color:var(--mute);flex:0 0 4.5rem}
dl.spec dd{margin:0;font-weight:500}

.tags{list-style:none;margin:1.5rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.5rem;font-size:.925rem}
.tags li{background:var(--surface);border:1px solid rgba(0,0,0,.08);border-radius:999px;padding:.35rem .85rem;color:var(--mute)}
.clients{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,15rem));gap:.7rem}
.clients li{background:var(--surface);border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;padding:clamp(.5rem,1.6vw,1.1rem)}
.clients img{display:block;width:100%;height:auto}

.foot{background:var(--ink);color:#fff;border-radius:var(--radius) var(--radius) 0 0;margin-top:clamp(2rem,5vw,3.5rem);padding-block:clamp(2.75rem,6vw,4.5rem)}
.foot h2{font-weight:800;font-size:clamp(1.9rem,5.2vw,3.6rem);line-height:1;letter-spacing:-.04em;margin:0;max-width:18ch}
.foot p{color:rgba(255,255,255,.72);max-width:52ch}
.foot .btn.quiet{color:#fff;border-color:rgba(255,255,255,.35)}
.foot .btn.quiet:hover{background:rgba(255,255,255,.12)}
.contact{margin:2rem 0 0;display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;font-size:1rem}
.contact a{color:#fff;text-underline-offset:3px}
.colophon{margin-top:2rem;font-size:.85rem;color:rgba(255,255,255,.5)}


/* ---------- dark mode (design page) ---------- */
body{background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px)}
.masthead{border-bottom-color:rgba(255,255,255,.07);background:rgba(22,22,24,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav .cta{background:var(--ink);color:#0E0E10}
.nav .cta:hover{background:#fff}
.btn{background:var(--ink);color:#0E0E10;border-color:var(--ink)}
.btn:hover{background:#fff}
.btn.accent{color:#fff}
.btn.accent:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.quiet{color:var(--ink);border-color:rgba(255,255,255,.22)}
.btn.quiet:hover{background:rgba(255,255,255,.07)}
figure.piece{border-color:rgba(255,255,255,.07)}
dl.spec{border-top-color:rgba(255,255,255,.09)}
.teaser a{border-color:rgba(255,255,255,.07)}
.teaser a:hover{border-color:rgba(255,255,255,.22)}
.tags li{border-color:rgba(255,255,255,.09)}
.clients li{background:#8e8e93;border-color:transparent}
.foot{background:#08080A;border-top:1px solid rgba(255,255,255,.07)}
.skip{background:var(--ink);color:#0E0E10}

@media (max-width:40rem){
  .masthead{position:static}
  .masthead .wrap{flex-wrap:wrap;row-gap:.45rem}
  .brand{font-size:1.1rem}
  .nav{width:100%;flex-wrap:wrap;gap:.15rem}
  .nav a:not(.cta){padding:.4rem .45rem;font-size:.82rem}
  .nav .cta{margin-left:.15rem;padding:.45rem .8rem;font-size:.82rem}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---------- restructure: motion feature, WIP map ---------- */
figure.piece.wide{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);align-items:center}
figure.piece.wide .frame{aspect-ratio:auto;align-self:stretch;min-height:clamp(18rem,28vw,25.5rem);background:#000}
figure.piece.wide .frame video{position:absolute;inset:0;object-fit:contain}
figure.piece.wide .piece-body{padding:1.5rem 1.6rem 1.7rem}
figure.piece.wide .piece-body h3{font-size:clamp(1.35rem,2.4vw,1.75rem);letter-spacing:-.03em}
@media (max-width:56rem){figure.piece.wide{grid-template-columns:1fr}figure.piece.wide .frame{aspect-ratio:16/9;min-height:0}}
.mapframe{background:#121316}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapsvg .riv{font:600 2.6px Figtree,system-ui,sans-serif;fill:#2f5b7a;letter-spacing:.3px}
.mapsvg .north text{font:700 3px Figtree,system-ui,sans-serif;fill:#6b6c74}
.mapsvg .route{animation:dash 6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pin{cursor:pointer;outline:none}
.pin .hit{fill:transparent}
.pin .dot{fill:#F0562A;stroke:#fff;stroke-width:.55;transition:r .2s}
.pin .ring{fill:none;stroke:#F0562A;stroke-width:.5;transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite;animation-delay:var(--d)}
@keyframes ping{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(3.4);opacity:0}}
.pin .lab{opacity:0;transform:translateY(1.5px);transition:opacity .18s,transform .18s;pointer-events:none}
.pin .lab rect{fill:#fff}
.pin .lab text{font:700 3.3px Figtree,system-ui,sans-serif;fill:#0E0E10;text-anchor:middle}
.pin:hover .lab,.pin:focus .lab,.pin:focus-visible .lab{opacity:1;transform:none}
.pin:hover .dot,.pin:focus .dot{r:2.3}
.wipbadge{position:absolute;left:.8rem;top:.8rem;background:var(--accent);color:#fff;font-size:.78rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:.3rem .7rem;border-radius:999px;pointer-events:none}
.maphint{position:absolute;right:.8rem;bottom:.8rem;background:rgba(0,0,0,.6);color:rgba(255,255,255,.82);font-size:.78rem;font-weight:600;padding:.3rem .7rem;border-radius:999px;pointer-events:none}
.backlink{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;color:var(--mute);font-weight:600;font-size:.95rem;margin-bottom:1.4rem}
.backlink:hover{color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(1.25rem,2.6vw,2rem)}
.grid2 .piece-body h3{font-size:clamp(1.2rem,2vw,1.45rem);letter-spacing:-.03em}
@media (max-width:48rem){.grid2{grid-template-columns:1fr}}
.pagehead{padding-block:clamp(2.5rem,6vw,4.5rem) clamp(1rem,3vw,2rem)}
.pagehead h1{font-weight:800;font-size:clamp(2.3rem,6.4vw,4.6rem);line-height:.98;letter-spacing:-.045em;margin:0;max-width:18ch}
.pagehead p{margin:1rem 0 0;color:var(--mute);max-width:52ch;font-size:clamp(1.0625rem,1.6vw,1.2rem)}
</style>
</head>

            <h3>London Waterloo ultra-wide</h3>
            <p>Motion built for the ultra-wide screen above the Waterloo concourse — one continuous canvas, read in seconds by people walking past it, with no pause and nowhere to hide a weak frame. In this four-minute walkthrough I talk through the process, with clips of the work running on the screen.</p>
