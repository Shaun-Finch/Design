name: Backtest opening-bell variants

# Run by hand from the Actions tab. Replays opening-range breakout variants on the last
# ~60 days of 5-minute bars and publishes backtest.json to the `research-data` branch.
on:
  workflow_dispatch:
    inputs:
      cost_pct:
        description: "Round-trip cost per trade in % (spread + slippage)"
        default: "0.05"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet --upgrade yfinance pandas numpy
      - name: Backtest
        env:
          COST_PCT: ${{ inputs.cost_pct }}
        run: python scripts/backtest_orb.py out
      - name: Publish to research-data branch
        run: |
          cd out
          git init -q -b research-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest.json
          git commit -q -m "Backtest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:research-data
