name: Backtest opening-bell variants

# Run by hand from the Actions tab. Replays opening-range breakout variants on the last
# ~60 days of 5-minute bars and publishes backtest.json to the `research-data` branch.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "orb = opening-bell variants (60 days of 5-minute bars); swing = dip-buying and momentum (12 years of daily bars)"
        type: choice
        options: [orb, swing]
        default: orb
      cost_pct:
        description: "Round-trip cost per trade in % (spread + slippage)"
        default: "0.05"
      universe:
        description: "core = Ventryx's ~100 large caps; wide = S&P 500 + MidCap 400 + Nasdaq-100"
        type: choice
        options: [core, wide]
        default: core

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet --upgrade yfinance pandas numpy lxml
      - name: Backtest
        env:
          COST_PCT: ${{ inputs.cost_pct }}
          UNIVERSE_SET: ${{ inputs.universe }}
          KIND: ${{ inputs.kind }}
        run: |
          if [ "$KIND" = "swing" ]; then python scripts/backtest_swing.py out; else python scripts/backtest_orb.py out; fi
      - name: Publish to research-data branch
        env:
          U: ${{ inputs.universe }}
          KIND: ${{ inputs.kind }}
        run: |
          mkdir pub && cd pub
          git init -q -b research-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keep earlier results (e.g. the other universe), then add this run's
          if git fetch -q --depth=1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-data; then
            git checkout -q FETCH_HEAD -- . || true
          fi
          if [ "$KIND" = "swing" ]; then
            cp ../out/backtest-swing.json backtest-swing.json
          else
            cp ../out/backtest.json "backtest-${U:-core}.json"
            cp ../out/backtest.json backtest.json
          fi
          git add -A
          git commit -q -m "Backtest (${KIND:-orb}, ${U:-core}) $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:research-data
