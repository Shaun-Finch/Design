name: Update sanctions data

# Refreshes data/sanctions.json (used by Xovern's Screening plug-in) from the
# official UK Sanctions List and OFAC SDN list every day.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanctions-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sanctions.json
        run: python scripts/build_sanctions.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sanctions.json
          if git diff --cached --quiet; then
            echo "No change in sanctions data."
          else
            git commit -m "Update sanctions data"
            git push
          fi
