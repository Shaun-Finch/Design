name: Avatar probe

# One-off research: fetch candidate 3D presenters from Microsoft Rocketbox (MIT licence), convert them
# to GLB with Blender, list their face rig and render preview stills to research-data/avatar/.
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Avatar folder names (space separated); empty = list what exists"
        default: "Business_Female_01 Business_Female_02 Business_Female_03 Business_Female_04"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q git-lfs
          cd scripts/news/avatar && npm init -y >/dev/null && npm install --silent --no-audit --no-fund playwright@1.48.2 three@0.169.0 && npx playwright install --with-deps chromium
      - name: Fetch Rocketbox avatars
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/microsoft/Microsoft-Rocketbox.git rb
          cd rb
          for n in ${{ inputs.names }}; do git sparse-checkout add "Assets/Avatars/Professions/$n"; done
          git lfs install --local && git lfs pull
          mkdir -p ../out && cp LICENSE.md ../out/ROCKETBOX_LICENSE.md
          for n in ${{ inputs.names }}; do d="Assets/Avatars/Professions/$n"; [ -d "$d" ] && cp -r "$d" ../out/ && du -sh "../out/$n"; ls "../out/$n/Textures" | head -20; done
      - name: Preview and face rig
        run: node scripts/news/avatar/preview.cjs out
      - name: Publish to research-data/avatar
        run: |
          mkdir pub && cd pub
          git init -q -b research-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-data; then git checkout -q FETCH_HEAD -- . || true; fi
          rm -rf avatar && mkdir avatar && cp -r ../out/* avatar/
          git add -A && git commit -q -m "Avatar probe $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:research-data
