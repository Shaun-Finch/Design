<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dailies — dashboard</title>
<meta name="description" content="Your Dailies dashboard: paste the round-up and every task is sorted by status, sector, round, priority and next step.">
<meta name="theme-color" content="#050507">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23d9ff3f'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%23050507'/%3E%3Cpath d='M8 7h7.5C21 7 25 10.8 25 16s-4 9-9.5 9H8z M12 10.8v10.4h3.4c3.1 0 5.2-2.1 5.2-5.2s-2.1-5.2-5.2-5.2z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="dailies.css">
</head>
<body>
<header class="hd"><div class="wrap">
  <a class="logo" href="./"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcff3f"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><path d="M6 5h9.5C22.4 5 27 9.6 27 16s-4.6 11-11.5 11H6z M11 9.8v12.4h4.3c3.9 0 6.5-2.5 6.5-6.2s-2.6-6.2-6.5-6.2z" fill="url(#lg)"/></svg>dailies</a><span class="sp"></span>
  <a class="btn doc" href="dailies-prompt.docx" download="Dailies-prompt.docx" title="Download the Dailies prompt as a Word document"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="l">Prompt</span><span class="x">.docx</span></a>
  <div class="menu" id="userMenu" hidden><button class="av" id="avatar" aria-label="Account menu"></button>
    <div class="pop" id="menuPop" hidden><button type="button" id="copyPrompt">Copy the prompt text</button><button type="button" id="clearSample">Clear sample data</button><button type="button" id="signOut">Sign out</button></div></div>
</div></header>

<main class="gate" id="gate" hidden>
  <form class="card" id="gateForm">
    <span class="mono">Sign in</span>
    <h1>Open your dashboard</h1>
    <p>Paste your end-of-day round-up and Dailies sorts it for you.</p>
    <label class="field"><span>Name</span><input type="text" id="gName" autocomplete="name" required maxlength="60"></label>
    <label class="field"><span>Work email</span><input type="email" id="gEmail" autocomplete="email" maxlength="120"></label>
    <label class="field"><span>Your sector</span><input type="text" id="gSector" list="sectorList" placeholder="e.g. UX/UI, Video, Marketing" maxlength="30"><datalist id="sectorList"></datalist></label>
    <label class="check"><input type="checkbox" id="gSample" checked> Start with a sample team board</label>
    <button class="btn primary" style="width:100%;height:44px" type="submit">Open dashboard</button>
    <p class="small" style="margin:14px 0 0">Your board is saved in this browser.</p>
  </form>
</main>

<main class="dash wrap" id="dash" hidden>
  <div class="hello"><div><span class="mono" id="dateL"></span><h1 id="hi">Hi</h1></div></div>
  <form class="card composer" id="composer">
    <label for="rt" class="mono" style="display:block;margin-bottom:8px">Today’s round-up</label>
    <textarea id="rt" placeholder="Paste the reply from the Dailies prompt, or just type: “Finished the checkout payment step and sent it for review. Next: apply the notes on Monday. High priority.”"></textarea>
    <div class="foot2"><div class="preview" id="preview" aria-live="polite"></div><button class="btn primary" id="addBtn" type="submit" disabled>Add to board</button></div>
  </form>
  <div class="stats" id="stats"></div>
  <div class="tools"><input type="search" id="q" placeholder="Search tasks" aria-label="Search tasks"><select id="fSector" aria-label="Sector"></select>
    <div class="seg" role="group" aria-label="View"><button type="button" data-view="table">Table</button><button type="button" data-view="board">Board</button></div></div>
  <div id="board"></div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="parse.js"></script>
<script src="app.js"></script>
</body>
</html>
